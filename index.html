<!DOCTYPE html>
<html lang ="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spatial Media Metadata Injector</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111;color:#eee}
main{max-width:720px;margin:auto;padding:18px}
h1{font-size:22px;margin:4px 0 4px}
.sub{color:#aaa;margin-bottom:18px}
.card{background:#1d1d1d;border-radius:16px;padding:16px;margin:12px 0}
label{display:block;color:#bbb;margin:12px 0 6px}
button,input,select{width:100%;font:inherit;border-radius:10px;border:1px solid #444;padding:12px;background:#252525;color:#fff}
button{cursor:pointer}
button.primary{background:#fff;color:#111;font-weight:700;border:0}
button:disabled{opacity:.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{white-space:pre-wrap;color:#bdbdbd;min-height:48px}
.progress{height:7px;background:#333;border-radius:99px;overflow:hidden;margin-top:10px}
.bar{height:100%;width:0;background:#fff;transition:width .2s}
.small{font-size:13px;color:#888}
a{color:#fff}
</style>
</head>
<body>
<main>
<h1>Spatial Media Metadata Injector</h1>
<div class="sub">Thêm Metadata 360° vào video</div><div class="card">
<label>Video MP4 / MOV</label>
<input id="file" type="file" accept=".mp4,.mov">
